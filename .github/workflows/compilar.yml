name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar carpeta www
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependencias y Capacitor
        run: |
          npm install
          npx cap init "SumUp Ahorro" "com.sumup.ahorro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: SumUp-Ahorro-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
